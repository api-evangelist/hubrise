description: HubRise supports active and passive callbacks. Active callbacks receive a POST request with a JSON body and include an HMAC SHA‑256
  signature in the `X-HubRise-Hmac-SHA256` header. The client must acknowledge with any 2xx‑4xx HTTP status within 20 seconds. If the response
  is 5xx or times out, HubRise retries up to 6 times, starting after 1 minute and doubling the wait after each attempt, up to a maximum of 32 minutes.
